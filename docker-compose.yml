services:
  db:
    image: mariadb:11
    container_name: btc-trading-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-btc_trading}
      MARIADB_USER: ${MARIADB_USER:-btc}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # LAN-only; not published to host. App reaches it on the compose network.

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: btc-trading-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-btc}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-btc_trading}
    command: ["pnpm", "db:push"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc-trading-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MARIADB_USER:-btc}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-btc_trading}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (any random 32+ char string)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Optional Manus passthroughs — leave blank for self-hosted use.
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      # OKX exchange. Market data needs no credentials; the rest is only used
      # when EXECUTION_VENUE routes trades to OKX. Defaults keep trading on the
      # in-database paper ledger.
      OKX_BASE_URL: ${OKX_BASE_URL:-https://www.okx.com}
      OKX_INST_ID: ${OKX_INST_ID:-BTC-USDT}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      OKX_DEMO: ${OKX_DEMO:-1}
      EXECUTION_VENUE: ${EXECUTION_VENUE:-internal}
      TRADING_FEE_BPS: ${TRADING_FEE_BPS:-0}
      OPTIMIZER_FEE_BPS: ${OPTIMIZER_FEE_BPS:-10}
      OKX_BOOK_CAPITAL_SGD: ${OKX_BOOK_CAPITAL_SGD:-0}
      TRADE_COOLDOWN_BARS: ${TRADE_COOLDOWN_BARS:-12}
      # Which strategy places trades. "engine" = indicator signals (long-standing
      # behaviour, and the default so a missing .env cannot silently change what
      # trades). "static" = hold a constant BTC weight, rebalancing on drift.
      STRATEGY_MODE: ${STRATEGY_MODE:-engine}
      STATIC_TARGET_WEIGHT: ${STATIC_TARGET_WEIGHT:-0.40}
      STATIC_REBALANCE_BAND: ${STATIC_REBALANCE_BAND:-0.10}
      POSITIONING_CCYS: ${POSITIONING_CCYS:-BTC,ETH,SOL,XRP,DOGE,LINK,AVAX,BNB,TRX,UNI,SUI,FIL,BCH,NEAR,ZEC,PEPE,WLD,HYPE,OKB,ETHFI}
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"

  # One-off script runner (okxCheck, strategyBacktest, historicalSignalReplay).
  #
  # The `app` runtime image contains only dist/ — it has no server/ directory,
  # so `docker compose run app pnpm tsx server/scripts/...` cannot work. This
  # service reuses the `build` stage, which has the full source tree and dev
  # dependencies (tsx included).
  #
  # Behind a profile so it never starts with `docker compose up`:
  #   docker compose run --rm tools pnpm tsx server/scripts/okxCheck.ts
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MARIADB_USER:-btc}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-btc_trading}
      OKX_BASE_URL: ${OKX_BASE_URL:-https://www.okx.com}
      OKX_INST_ID: ${OKX_INST_ID:-BTC-USDT}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      OKX_DEMO: ${OKX_DEMO:-1}
    restart: "no"

volumes:
  db_data:
