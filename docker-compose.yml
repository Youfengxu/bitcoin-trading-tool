services:
  db:
    image: mariadb:11
    container_name: btc-trading-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-btc_trading}
      MARIADB_USER: ${MARIADB_USER:-btc}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # LAN-only; not published to host. App reaches it on the compose network.

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: btc-trading-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-btc}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-btc_trading}
    command: ["pnpm", "db:push"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc-trading-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MARIADB_USER:-btc}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-btc_trading}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (any random 32+ char string)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Optional Manus passthroughs — leave blank for self-hosted use.
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"

volumes:
  db_data:
